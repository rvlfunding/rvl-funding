name: Weekly Insights Update

"on":
  schedule:
    - cron: '0 17 * * 1'
  workflow_dispatch:
    inputs:
      test_segment_id:
        description: 'Test only: a Resend segment ID that holds just your own address. Leave empty for a normal run.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-insights:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run insights fetch script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          TEST_SEGMENT_ID: ${{ inputs.test_segment_id }}
        run: node scripts/fetch-insights.mjs

      - name: Commit updated insights data
        if: ${{ !inputs.test_segment_id }}
        run: |
          git config user.name "RVL Insights Bot"
          git config user.email "bot@rvlfunding.com"
          git add public/insights-data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly insights update - $(date +'%Y-%m-%d')"
            git push origin HEAD:main
          fi
